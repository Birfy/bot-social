name: CI
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Typecheck
        run: npx tsc --noEmit -p .
      - name: Tests + coverage
        run: npm run coverage 2>&1 | tee test-output.txt
      - name: Summary
        if: always()
        run: |
          {
            echo "## Test results"
            grep -E '^# (tests|pass|fail)' test-output.txt || true
            echo
            echo '### Coverage'
            echo '```'
            sed -n '/start of coverage report/,/end of coverage report/p' test-output.txt | sed 's/^# //'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
